# Grouped, weekly updates (QOHA-3756). Majors of packages that only work together arrive
# as one PR per family; every minor and patch update of a directory arrives as one PR.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/app-fullstack"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "major"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
